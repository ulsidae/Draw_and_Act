<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw and Act!</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #101014;
      color: #fff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .container {
      width: min(760px, 100%);
      text-align: center;
    }

    .thumbnail {
      width: min(100%, 720px);
      display: block;
      margin: 0 auto 28px;
      border-radius: 18px;
      border: 1px solid #303038;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
    }

    .logo {
      font-size: clamp(48px, 10vw, 82px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -5px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 34px;
    }

    .card {
      background: #19191f;
      border: 1px solid #303038;
      border-radius: 18px;
      padding: 28px;
    }

    .prompt {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .languages {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    a {
      display: block;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      transition: opacity .2s, transform .2s;
    }

    a:hover {
      opacity: .85;
      transform: translateY(-2px);
    }

    .lingua {
      background: #303038;
      color: #fff;
    }

    .footer {
      margin-top: 18px;
      color: #555;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .logo {
        letter-spacing: -3px;
      }

      .languages {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">Draw and Act!</div>

    <div class="subtitle">
      Draw, act, and create your own story.
    </div>

    <section class="card">
      <div class="prompt">Choose your language</div>

      <div class="languages">
        <a class="lingua" href="en.html">English</a>
        <a class="lingua" href="fr.html">français</a>
        <a class="lingua" href="jp.html">日本語</a>
        <a class="lingua" href="ko.html">한국어</a>
      </div>
    </section>

    <div class="footer">
      All you need is a device and your imagination.
    </div>
  </main>
</body>
</html>
